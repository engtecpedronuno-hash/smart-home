name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with WebView shell / HTML to APK
      run: |
        echo "A preparar os ficheiros para o empacotamento em WebView..."
        mkdir -p android-app/assets
        cp index.html app.js style.css logo.png android-app/assets/
        ls -la android-app/assets/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PedroNuno-SmartHome-APK
        path: android-app/
