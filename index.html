<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedro Nuno — Engenho e Tecnologia</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 1.25rem 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1400px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1rem;
            width: 100%;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .header-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.025em;
            line-height: 1.2;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.2rem;
            line-height: 1.2;
        }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        button.mic-btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button.mic-btn:hover {
            background-color: var(--accent-hover);
        }

        button.mic-btn.listening {
            background-color: #d32f2f;
            color: white;
            animation: pulse 1.5s infinite;
        }

        #voiceStatus {
            font-size: 11px;
            color: var(--text-secondary);
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.85rem;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 10px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 85px;
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.3);
        }

        .card:active {
            transform: scale(0.98);
        }

        .device-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.3rem;
            word-break: break-word;
        }

        .device-status {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--text-secondary);
        }

        .card.on .device-status {
            color: #22c55e;
        }

        .card.off .device-status {
            color: #ef4444;
        }

        @media (min-width: 640px) {
            body {
                padding: 2rem 1.5rem;
            }
            header {
                gap: 1.25rem;
                margin-bottom: 2.5rem;
                padding-bottom: 1.25rem;
            }
            .logo-container {
                width: 56px;
                height: 56px;
            }
            h1 {
                font-size: 1.6rem;
            }
            p.subtitle {
                font-size: 0.95rem;
            }
            .grid {
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 1.15rem;
            }
            .card {
                padding: 1.25rem;
                min-height: 100px;
            }
            .device-name {
                font-size: 1.05rem;
            }
            .device-status {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-left">
                <div class="logo-container">
                    <img src="logo.png" alt="Logótipo">
                </div>
                <div class="header-text">
                    <h1>Pedro Nuno</h1>
                    <p class="subtitle">Engenho e Tecnologia — Controlo Local</p>
                </div>
            </div>
            <div class="header-right">
                <button id="micBtn" class="mic-btn" onclick="toggleVoiceControl()">🎙️ Comando por Voz</button>
                <span id="voiceStatus">Em repouso</span>
            </div>
        </header>

        <main class="grid" id="deviceGrid">
            <!-- Dispositivos exatos retirados das fotografias -->
        </main>
    </div>

    <script>
        const devices = [
            { name: "sala", state: false },
            { name: "sala de estar", state: false },
            { name: "Setup", state: false },
            { name: "luz do quarto", state: false },
            { name: "WC", state: false },
            { name: "luz do laboratório", state: false },
            { name: "bancada", state: false },
            { name: "candeeiro da xana", state: false },
            { name: "Candeeiro do Pedro (Antigo)", state: false },
            { name: "cozinha", state: false },
            { name: "fonte de alimentação", state: false },
            { name: "candeeiro do Pedro", state: false },
            { name: "Quarto", state: false },
            { name: "TV", state: false },
            { name: "sensor de porta", state: false },
            { name: "IR inteligente", state: false },
            { name: "Campainha inteligente", state: false },
            { name: "TV box", state: false }
        ];

        function renderDevices() {
            const grid = document.getElementById('deviceGrid');
            grid.innerHTML = '';
            
            devices.forEach((dev, index) => {
                const card = document.createElement('div');
                card.className = `card ${dev.state ? 'on' : 'off'}`;
                card.onclick = (evt) => triggerDevice(index, evt);

                const statusText = dev.state ? 'LIGADO' : 'DESLIGADO';

                card.innerHTML = `
                    <div class="device-name">${dev.name}</div>
                    <div class="device-status">${statusText}</div>
                `;
                grid.appendChild(card);
            });
        }

        function triggerDevice(index, evt) {
            devices[index].state = !devices[index].state;
            renderDevices();
            // Execução isolada localmente no painel web, sem abrir aplicações externas
        }

        let recognition;
        let isListening = false;

        function toggleVoiceControl() {
            const micBtn = document.getElementById('micBtn');
            const voiceStatus = document.getElementById('voiceStatus');

            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('O seu browser não suporta reconhecimento de voz.');
                return;
            }

            if (isListening) {
                recognition.stop();
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-PT';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                isListening = true;
                micBtn.classList.add('listening');
                micBtn.innerText = '🔴 A Ouvir...';
                voiceStatus.innerText = 'Ouvindo...';
            };

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript.toLowerCase();
                voiceStatus.innerText = '"' + speechResult + '"';
                processVoiceCommand(speechResult);
            };

            recognition.onerror = function() {
                voiceStatus.innerText = 'Erro de voz';
            };

            recognition.onend = function() {
                isListening = false;
                micBtn.classList.remove('listening');
                micBtn.innerText = '🎙️ Comando por Voz';
            };

            recognition.start();
        }

        function processVoiceCommand(command) {
            let matched = false;
            const cleanCommand = command.toLowerCase();

            devices.forEach(dev => {
                const devName = dev.name.toLowerCase();
                if (cleanCommand.includes(devName)) {
                    if (cleanCommand.includes('ligar') || cleanCommand.includes('liga')) {
                        dev.state = true;
                        matched = true;
                    } else if (cleanCommand.includes('desligar') || cleanCommand.includes('desliga')) {
                        dev.state = false;
                        matched = true;
                    }
                }
            });

            if (!matched) {
                voiceStatus.innerText += ' (Não reconhecido)';
            }
            renderDevices();
        }

        renderDevices();
    </script>
</body>
</html>
