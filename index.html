<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controlo - Casa Pedro</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 15px;
        }
        h1 {
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #58a6ff;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card:active {
            transform: scale(0.97);
        }
        .card-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: #ffffff;
            margin: 0 0 4px 0;
            text-transform: capitalize;
        }
        .card-room {
            font-size: 0.75rem;
            color: #8b949e;
            margin: 0 0 10px 0;
        }
        .card-status {
            font-size: 0.85rem;
            font-weight: bold;
        }
        .status-desligado {
            color: #f85149;
        }
        .status-ligado {
            color: #3fb950;
        }
    </style>
</head>
<body>

    <h1>Painel de Controlo</h1>
    
    <div class="grid" id="device-grid">
        <!-- Os cartões serão gerados dinamicamente ou listados abaixo -->
    </div>

    <script>
        // Lista dos 15 dispositivos mapeados
        const devices = [
            { id: "sala", name: "Sala", room: "Sala de Estar", state: false },
            { id: "candeeiro_pedro", name: "Candeeiro do Pedro", room: "Sala de Estar", state: false },
            { id: "fonte_alimentacao", name: "Fonte de Alimentação", room: "Sala de Estar", state: false },
            { id: "sensor_porta", name: "Sensor da Porta", room: "Sala de Estar", state: false },
            { id: "candeeiro_xana", name: "Candeeiro da Xana", room: "Sala de Estar", state: false },
            { id: "quarto", name: "Quarto", room: "Sala de Estar", state: false },
            { id: "setup", name: "Setup", room: "Sala de Estar", state: false },
            { id: "ir_inteligente", name: "IR Inteligente", room: "Sala de Estar", state: false },
            { id: "sala_estar", name: "Sala de Estar", room: "Sala de Estar", state: false },
            { id: "campainha_inteligente", name: "Campainha Inteligente", room: "Entrada", state: false },
            { id: "bancada", name: "Bancada", room: "Entrada", state: false },
            { id: "cozinha", name: "Cozinha", room: "Cozinha", state: false },
            { id: "luz_quarto", name: "Luz do Quarto", room: "Quarto Principal", state: false },
            { id: "luz_laboratorio", name: "Luz do Laboratório", room: "Sala de Estar", state: false },
            { id: "wc", name: "WC", room: "Sala de Estar", state: false }
        ];

        const grid = document.getElementById('device-grid');

        function renderGrid() {
            grid.innerHTML = '';
            devices.forEach((dev, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => toggleDevice(index);

                card.innerHTML = `
                    <p class="card-title">${dev.name}</p>
                    <p class="card-room">${dev.room}</p>
                    <p class="card-status ${dev.state ? 'status-ligado' : 'status-desligado'}">
                        ${dev.state ? 'LIGADO' : 'DESLIGADO'}
                    </p>
                `;
                grid.appendChild(card);
            });
        }

        async function toggleDevice(index) {
            const dev = devices[index];
            const newState = !dev.state;

            try {
                // Endpoint local de exemplo (ajuste para o IP do seu controlador ou API local)
                const response = await fetch(`http://192.168.1.100/api/control?id=${dev.id}&state=${newState ? 'on' : 'off'}`, {
                    method: 'GET', // ou 'POST' conforme a sua API
                    mode: 'no-cors' // Ajuste se necessário para evitar problemas de CORS na rede local
                });

                // Atualiza o estado localmente após o clique bem-sucedido
                dev.state = newState;
                renderGrid();
            } catch (error) {
                console.error("Erro ao comunicar com o dispositivo:", error);
                alert("Falha na comunicação com o dispositivo na rede local.");
            }
        }

        // Renderização inicial ao carregar a página
        renderGrid();
    </script>
</body>
</html>
