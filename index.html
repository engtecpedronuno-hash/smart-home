<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedro Nuno - Engenho e Tecnologia - Controle Local</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            padding: 10px;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            padding: 15px 10px;
            border-bottom: 1px solid #1b263b;
            margin-bottom: 15px;
            gap: 10px;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 200px;
        }
        .logo-container img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            flex-shrink: 0;
            border-radius: 6px;
        }
        .header-title {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .header-title h1 {
            font-size: 1rem;
            font-weight: bold;
            color: #ffffff;
            line-height: 1.2;
        }
        .header-title span {
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .voice-btn {
            background-color: #1e3a8a;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }
        .card {
            background-color: #1b263b;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 90px;
            cursor: pointer;
            border: 1px solid #283850;
            transition: background-color 0.2s;
        }
        .card:active {
            background-color: #27374d;
        }
        .card-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: #e2e8f0;
            word-break: break-word;
        }
        .card-room {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 4px;
        }
        .card-status {
            font-size: 0.8rem;
            font-weight: bold;
            margin-top: 8px;
            text-transform: uppercase;
        }
        .status-off {
            color: #ef4444;
        }
        .status-on {
            color: #22c55e;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <!-- Substitua o src pelo link correto ou imagem do seu logótipo -->
            <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
            <div class="header-title">
                <h1>Pedro Nuno - Engenho e Tecnologia</h1>
                <span>Controle Local</span>
            </div>
        </div>
        <button class="voice-btn" onclick="alert('Comando por voz ativo')">Comando por Voz</button>
    </header>

    <div class="grid-container" id="device-grid">
        <!-- Dispositivos reais configurados -->
    </div>

    <script>
        const devices = [
            { name: "sala", room: "Sala de Estar", status: false },
            { name: "candeeiro do pedro", room: "Sala de Estar", status: false },
            { name: "fonte de alimentação", room: "Sala de Estar", status: false },
            { name: "sensor da porta", room: "Sala de Estar", status: false },
            { name: "candeeiro da xana", room: "Sala de Estar", status: false },
            { name: "Quarto", room: "Sala de Estar", status: false },
            { name: "Setup", room: "Sala de Estar", status: false },
            { name: "IR inteligente", room: "Sala de Estar", status: false },
            { name: "sala de estar", room: "Sala de Estar", status: false },
            { name: "Campainha inteligente", room: "Entrada", status: false },
            { name: "bancada", room: "Entrada", status: false },
            { name: "cozinha", room: "Cozinha", status: false },
            { name: "luz do quarto", room: "Quarto principal", status: false },
            { name: "luz do laboratório", room: "Sala de Estar", status: false },
            { name: "WC", room: "Sala de Estar", status: false }
        ];

        function renderGrid() {
            const grid = document.getElementById('device-grid');
            grid.innerHTML = '';
            devices.forEach((dev, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => toggleDevice(index);
                
                card.innerHTML = `
                    <div>
                        <div class="card-title">${dev.name}</div>
                        <div class="card-room">${dev.room}</div>
                    </div>
                    <div class="card-status ${dev.status ? 'status-on' : 'status-off'}">
                        ${dev.status ? 'LIGADO' : 'DESLIGADO'}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleDevice(index) {
            devices[index].status = !devices[index].status;
            renderGrid();
        }

        renderGrid();
    </script>
</body>
</html>
