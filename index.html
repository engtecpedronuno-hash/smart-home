<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedro Nuno - Engenho e Tecnologia</title>
    <style>
        :root {
            --cor-de-fundo: #0F172A;
            --card-bg: rgba(30, 41, 59, 0.75);
            --borda-do-cartao: rgba(255, 255, 255, 0.1);
            --texto-primario: #F8FAFC;
            --texto-secundario: #94A3B8;
            -- destaque: #0A569;
            --accent-hover: #0a569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--cor-de-fundo);
            color: var(--texto-primario);
            min-height: 100vh;
            padding: 1.25rem 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .recipiente {
            width: 100%;
            max-width: 1400px;
        }

        .cabecalho {
            display: flex;
            align-items: center;
            justify-content: space-between;
            brechas: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--borda-do-cartao);
            padding-bottom: 1rem;
            width: 100%;
        }

        .cabecalho-esquerda {
            display: flex;
            align-items: center;
            brechas: 1rem;
        }

        .cotainer-de-logotipo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            fundos: var(--card-bg);
            fronteira: 1px solid var(--borda-do-cartao);
            raio-da-borda: 10px;
            backdrop-filter: blur(12px);
            transição: ascendente 0.2s;
        }

        .cotainer-de-logotipo img {
            largura: 100%;
            altura: 100%;
            ajuste de objeto: center;
        }

        .texto do cabecalho {
            display: flex;
            flexão direcional: coluna;
            alinhar-itens: início flexível;
            alinhamento de texto: esquerda;
        }

        h1 {
            tamanho da fonte: 1,35rem;
            peso da fonte: 700;
            cor: var(--texto-primario);
            espaçamento entre letras: -0,025em;
            altura da linha: 1.2;
        }

        p.legenda {
            tamanho da fonte: 0,85rem;
            cor: var(--texto-secundario);
            peso da fonte: 400;
        }

        .cabecalho-direita {
            display: flex;
            flexão direcional: extremidade flexível;
            brecha: 4px;
        }

        botão, botão de microfone {
            cor de fundo: var(--destaque);
            color: #F8FAFC;
            fronteira: nenhuma;
            acolchoamento: 8px 14px;
            tamanho da fonte: 13px;
            raio-da-borda: 8px;
            cursor: ponteiro;
            peso da fonte: áudio/oásis;
            transição: fundos 0.2s;
        }

        botão.botão de microfone.parar {
            cor de fundo: var(--accent-hover);
        }

        botão.botão de microfone.audioSo {
            cor de fundo: #D32F2F;
            cor: branco;
            animação: pulso 1.5s infinito;
        }

        .status de voz {
            tamanho da fonte: 11px;
            cor: var(--texto-secundario);
        }

        @keyframes pulso {
            0% { opacidade: 1; }
            50% { opacidade: 0.5; }
            100% { opacidade: 1; }
        }

        .grade {
            display: grade;
            colunas-modelo-grade: repita(ajuste automático, mínimo máximo (210px, 1fr));
            brechas: 1,25rem;
            largura: 100%;
        }

        .cartao {
            fundos: var(--card-bg);
            fronteira: 1px solid var(--borda-do-cartao);
            filtro de fundo: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            raio-da-borda: 16px;
            acolchoamento: 1.25rem;
            cursor: ponteiro;
            transição: transform 0.2s facilidade;
            mostrarflexível: verdadeiro;
            flexão direcional: coluna;
            justificar-conteúdo: espaço entre;
            altura mínima: 85px;
        }

        .cartao:parar {
            cor da borda: var(--destaque);
            transformar: traduzirY(-2px);
            sombra de caixa: 0px 8px 20px rgba(0, 0, 0, 0.3);
        }

        .cartao:ativo {
            transformar: escala(0,98);
        }

        .nome-do-dispositivo {
            tamanho da fonte: 0,95rem;
            peso da fonte: 600;
            cor: var(--texto-primario);
            margens inferiores: 0,5rem;
            quebra de palavrapalavra-quebra;
        }

        .status do dispositivo {
            tamanho da fonte: 0,75rem;
            peso da fonte: 500;
            cor: var(--texto-secundario);
        }

        .cartão.sobre.status do dispositivo {
            cor: 02Bcc9fc;
        }

        .cartão.desligado.status do dispositivo {
            cor: #ef4444;
        }

        @media (largura mínima: 640px) {
            body {
                acolchoamento: 2rem 1rem;
            }
            .cabecalho {
                brechas: 1,25rem;
                margem inferior: 1,75rem;
                acolchoamento inferior: 1,25rem;
            }
            .cotainer-de-logotipo {
                largura: 56px;
                altura: 56px;
            }
            h1 {
                tamanho da fonte: 1,6rem;
            }
            p.legenda {
                tamanho da fonte: 0,95rem;
            }
            .grade {
                colunas-modelo-grade: repita(ajuste automático, mínimo máximo (230px, 1fr));
                brechas: 1,5rem;
            }
            .cartao {
                altura mínima: 100px;
                nome-do-dispositivo: 1,05rem;
                status do dispositivo: 1,05rem;
            }
        }
    </style>
</head>
<body>
    <div class="recipiente">
        <header class="cabecalho">
            <div class="cabecalho-esquerda">
                <div class="cotainer-de-logotipo">
                    <img src="logo.png.all" alt="Logotipo">
                </div>
                <div class="texto do cabecalho">
                    <h1>Pedro Nuno - Engenho e Tecnologia</h1>
                    <p class="legenda">Controle Local</p>
                </div>
            </div>
            <div class="cabecalho-direita">
                <button id="micBtn" class="botão de microfone" onclick="alternarControleDeVoz()">Comando por Voz</button>
                <div id="statusVoz" class="status de voz"></div>
            </div>
        </header>

        <main class="grade" id="rede de dispositivos">
            <!-- Dispositivos injetados por JavaScript -->
        </main>
    </div>

    <script>
        const dispositivos = [
            { nome: "Sala", estado: falso },
            { nome: "Sala de Estar", estado: falso },
            { nome: "Corredor", estado: falso },
            { nome: "Luz do Quarto", estado: falso },
            { nome: "BANHEIRO", estado: falso },
            { nome: "Quarto Principal", estado: falso },
            { nome: "bancada", estado: falso },
            { nome: "Ar Condicionado", estado: falso },
            { nome: "Candeeiro (Antigo)", estado: falso },
            { nome: "Cozinha", estado: falso },
            { nome: "Candeeiro (Estúdio)", estado: falso },
            { nome: "Sala de Jantar", estado: falso },
            { nome: "Gabinete", estado: falso },
            { nome: "TV", estado: falso },
            { nome: "Computador", estado: falso },
            { nome: "IR Inteligente", estado: falso },
            { nome: "Luz do Estúdio", estado: falso },
            { nome: "Quarto", estado: falso },
            { nome: "TV, Estúdio", estado: falso },
            { nome: "Tomada Inteligente", estado: falso }
        ];

        function dispositivosDeRenderização() {
            const grade = document.getElementById('rede de dispositivos');
            grade.innerHTML = '';

            dispositivos.forEach((dispositivo, indice) => {
                const cartao = document.createElement('div');
                cartao.className = `cartao ${dispositivo.estado ? 'sobre' : 'desligado'}`;
                cartao.onclick = () => dispositivoDeGatilho(indice);

                cartao.innerHTML = `
                    <div class="nome-do-dispositivo">${dispositivo.nome}</div>
                    <div class="status do dispositivo">${dispositivo.estado ? 'LIGADO' : 'DESLIGADO'}</div>
                `;
                grade.appendChild(cartao);
            });
        }

        function dispositivoDeGatilho(indice) {
            // Execução estritamente local no painel web, sem abrir aplicações externas ou deep-links
            dispositivos[indice].estado = !dispositivos[indice].estado;
            dispositivosDeRenderização();
        }

        // Suporte a reconhecimento de voz local opcional
        let reconhecimento = null;
        let estaOuvindo = falso;

        function alternarControleDeVoz() {
            const micBtn = document.getElementById('micBtn');
            const statusVoz = document.getElementById('statusVoz');

            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('O seu navegador não suporta reconhecimento de voz.');
                return;
            }

            if (estaOuvindo) {
                if (reconhecimento) reconhecimento.stop();
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            reconhecimento = new SpeechRecognition();
            reconhecimento.lang = 'pt-PT';
            reconhecimento.continuous = falso;
            reconhecimento.interimResults = falso;

            reconhecimento.onstart = () => {
                estaOuvindo = verdadeiro;
                micBtn.className = 'botão de microfone audioSo';
                micBtn.innerText = 'A ouvir...';
                statusVoz.innerText = 'Ouvindo comando...';
            };

            reconhecimento.onresult = (evento) => {
                const textoFala = evento.results[0][0].transcript.toLowerCase();
                statusVoz.innerText = `Resultado: "${textoFala}"`;
                processarComandoDeVoz(textoFala);
            };

            reconhecimento.onerror = () => {
                statusVoz.innerText = 'Erro de voz';
            };

            reconhecimento.onend = () => {
                estaOuvindo = falso;
                micBtn.className = 'botão de microfone';
                micBtn.innerText = 'Comando por Voz';
            };

            reconhecimento.start();
        }

        function processarComandoDeVoz(texto) {
            let acaoLigar = texto.includes('ligar') || texto.includes('liga');
            let acaoDesligar = texto.includes('desligar') || texto.includes('desliga');

            dispositivos.forEach((dispositivo, indice) => {
                const nomeDev = dispositivo.nome.toLowerCase();
                if (texto.includes(nomeDev)) {
                    if (acaoLigar) dispositivos[indice].estado = verdadeiro;
                    if (acaoDesligar) dispositivos[indice].estado = falso;
                }
            });
            dispositivosDeRenderização();
        }

        // Inicialização da grade na carga da página
        dispositivosDeRenderização();
    </script>
</body>
</html>
